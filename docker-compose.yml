services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BURSAR_DATABASE_PATH: /data/bursar.db
      BURSAR_API_AUTH_MODE: ${BURSAR_API_AUTH_MODE:-required}
      BURSAR_API_KEY: ${BURSAR_API_KEY:-}
      BURSAR_FINANCE_REVIEWER_API_KEY: ${BURSAR_FINANCE_REVIEWER_API_KEY:-}
      BURSAR_FINANCE_REVIEWER_ID: ${BURSAR_FINANCE_REVIEWER_ID:-}
      BURSAR_FINANCE_REVIEWER_IDS: ${BURSAR_FINANCE_REVIEWER_IDS:-}
      SWITCH_BASE_URL: ${SWITCH_BASE_URL:-}
      SWITCH_TOKEN: ${SWITCH_TOKEN:-}
      SWITCH_TEAM_ID: ${SWITCH_TEAM_ID:-}
      SWITCH_TEAM_NAME: ${SWITCH_TEAM_NAME:-}
      SWITCH_CHANNEL_ID: ${SWITCH_CHANNEL_ID:-}
      SWITCH_TIMEOUT_SECONDS: ${SWITCH_TIMEOUT_SECONDS:-10}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
    ports:
      - "8000:8000"
    volumes:
      - bursar_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "app/ui/bursar_dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      BURSAR_DATABASE_PATH: /data/bursar.db
    ports:
      - "8501:8501"
    volumes:
      - bursar_data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  bursar_data:
    name: bursar_control_room_data
